spring.jpa.hibernate.ddl-auto=create-drop

# Flyway bi tat trong test: cac migration viet bang cu phap PostgreSQL,
# khong chay duoc tren H2. Schema test do Hibernate tu tao (create-drop).
spring.flyway.enabled=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use H2 dialect for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional: Set mode to PostgreSQL for better compatibility
# H2 does not know the PostgreSQL "tsvector" type used by Tour.search_vector (full-text search
# column populated by a DB trigger in production) - register it as a domain alias so DDL creation
# of the "tours" table (and anything with a FK to it) does not fail in tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS TSVECTOR AS VARCHAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# @DataJpaTest auto-replaces the DataSource with its own default embedded H2 instance (ignoring
# the URL above, including MODE=PostgreSQL and the tsvector domain) unless this is disabled.
spring.test.database.replace=none

# Test resources replace (not merge with) src/main/resources/application.properties, so every
# externally-configured property referenced via @Value needs a dummy value here for a full
# @SpringBootTest context (e.g. BookingTourApplicationTests) to be able to start.
jwt.secret=test-jwt-secret-key-for-unit-tests-only-not-for-production-use
jwt.access-expiration=900000
jwt.refresh-expiration=2592000000
app.auth.refresh-cookie.name=refresh_token
app.auth.refresh-cookie.path=/api/auth
app.auth.refresh-cookie.secure=false
app.auth.refresh-cookie.same-site=Lax
app.admin.username=admin
app.admin.password=admin
app.admin.email=admin@test.com
frontend.url=http://localhost:5173
google.client.id=test-google-client-id
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
payos.client-id=test-payos-client-id
payos.api-key=test-payos-api-key
payos.checksum-key=test-payos-checksum-key
payos.return-url=http://localhost:5173/payment/success
payos.cancel-url=http://localhost:5173/payment/cancel
