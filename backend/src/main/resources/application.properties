spring.application.name=Booking_Tour

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# validate: Hibernate doi chieu entity voi schema that luc khoi dong,
# lech la bao loi ngay thay vi de lo ra luc chay. Schema do Flyway tao.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gom cac cau lenh load collection LAZY thanh 1 query IN (...) -> chong N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Flyway: quan ly version schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Database dev hien tai DA co san 18 bang nhung chua co lich su Flyway.
# baseline-on-migrate=true + baseline-version=1: Flyway ghi nhan V1 la "da ap dung"
# va bo qua, tranh loi "relation already exists". Voi database RONG (may moi, CI,
# production lan dau) thi khong co gi de baseline, Flyway chay V1 binh thuong.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8082

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}

# Email Configuration (Brevo HTTP API)
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Booking Tour
# JWT Configuration
jwt.secret=${JWT_SECRET}
# Access token: 15 phut. Ngan la co y - day la toan bo cua so thiet hai neu
# token lot ra ngoai, va he thong khong co cach nao thu hoi no som hon.
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Refresh token: 30 ngay, tinh TUYET DOI tu luc dang nhap. Xoay vong khong gia
# han them, nen sau 30 ngay la buoc dang nhap lai du nguoi dung vao moi ngay.
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Cookie chua refresh token
# httpOnly luon bat trong code - JavaScript khong duoc doc token 30 ngay.
# path=/api/auth: cookie chi bam theo /refresh va /logout, khong gui kem hang
# tram request API khac.
app.auth.refresh-cookie.name=refresh_token
app.auth.refresh-cookie.path=/api/auth
# Dev (localhost:5173 -> localhost:8082): cookie khong phan biet cong nen van la
# same-site, de Lax va secure=false cho HTTP chay duoc.
# *** TRIEN KHAI THAT, frontend va backend khac domain: BAT BUOC dat
#     REFRESH_COOKIE_SECURE=true va REFRESH_COOKIE_SAME_SITE=None, keo theo
#     HTTPS ca hai dau. Thieu mot trong hai thi trinh duyet lang le vut cookie
#     va nguoi dung bi dang xuat sau moi 15 phut ma khong co loi nao hien ra. ***
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Admin Initializer Configuration
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}

# Frontend Config
frontend.url=${FRONTEND_URL}
# Google Auth
google.client.id=${GOOGLE_CLIENT_ID}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}

# Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Dia chi cua proxy dat truoc ung dung (nginx, load balancer...), phan cach bang
# dau phay. De TRONG khi ung dung nhan request truc tiep - va do la mac dinh.
#
# RateLimitingFilter chi tin header X-Forwarded-For khi request den TU mot trong
# nhung dia chi nay. Header do la thu CLIENT tu gui: tin vo dieu kien thi chi can
# doi gia tri moi request la co bucket moi moi lan, va gioi han 10 lan dang
# nhap/phut - lop chong do mat khau duy nhat - khong con y nghia.
#
# *** TRIEN KHAI THAT sau nginx/CDN: BAT BUOC dat bien nay bang dia chi cua proxy,
#     neu khong moi nguoi dung se dung chung mot bucket (chinh la IP cua proxy) va
#     mot nguoi dang nhap sai vai lan se khoa ca he thong. ***
app.security.trusted-proxies=${TRUSTED_PROXIES:}
