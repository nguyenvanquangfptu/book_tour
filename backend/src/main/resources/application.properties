spring.application.name=Booking_Tour

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# validate: Hibernate doi chieu entity voi schema that luc khoi dong,
# lech la bao loi ngay thay vi de lo ra luc chay. Schema do Flyway tao.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gom cac cau lenh load collection LAZY thanh 1 query IN (...) -> chong N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# Flyway: quan ly version schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Database dev hien tai DA co san 18 bang nhung chua co lich su Flyway.
# baseline-on-migrate=true + baseline-version=1: Flyway ghi nhan V1 la "da ap dung"
# va bo qua, tranh loi "relation already exists". Voi database RONG (may moi, CI,
# production lan dau) thi khong co gi de baseline, Flyway chay V1 binh thuong.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8082

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:16379}

# Email Configuration (Brevo HTTP API)
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Booking Tour
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Admin Initializer Configuration
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}

# Frontend Config
frontend.url=${FRONTEND_URL}
# Google Auth
google.client.id=${GOOGLE_CLIENT_ID}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}

# Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB