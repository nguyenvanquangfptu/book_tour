# Cac job chay tren ca "dev" va "main" de test truoc khi merge vao main. Rieng job
# deploy-frontend dung OIDC voi IAM Role chi tin nhanh "main" (infra/gitlab_oidc.tf), nen
# chay tu dev se bi AWS tu choi (AccessDenied) - do la co y, khong phai loi.
stages:
  - infra
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  TF_ROOT: infra
  TF_STATE_BUCKET: "booktour-tfstate-${CI_PROJECT_ID}"
  TF_STATE_KEY: "booktour.tfstate"
  TF_STATE_REGION: "ap-southeast-1"

# Chi can chay 1 LAN DUY NHAT, truoc job terraform-plan dau tien: tao bucket S3 rieng de
# luu Terraform state (Terraform khong the tu tao bucket ma no se dung lam backend cua chinh
# no). Dung lai AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY da co san. Chay lai cac lan sau van
# an toan (bo qua neu bucket da ton tai).
bootstrap-state-bucket:
  stage: infra
  image:
    name: amazon/aws-cli:2.15.0
    # Image nay cung dat san ENTRYPOINT la "aws", giong het van de gap voi hashicorp/terraform -
    # ghi de ve rong de GitLab chay duoc script bang shell binh thuong.
    entrypoint: [""]
  script:
    - |
      if aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
        echo "Bucket ${TF_STATE_BUCKET} da ton tai, bo qua."
      else
        aws s3api create-bucket --bucket "${TF_STATE_BUCKET}" --region "${TF_STATE_REGION}" --create-bucket-configuration LocationConstraint="${TF_STATE_REGION}"
        aws s3api put-bucket-versioning --bucket "${TF_STATE_BUCKET}" --versioning-configuration Status=Enabled
        aws s3api put-public-access-block --bucket "${TF_STATE_BUCKET}" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual

.terraform-base:
  image:
    name: hashicorp/terraform:1.9
    # Image nay dat san ENTRYPOINT la "terraform", ghi de ve rong de GitLab chay duoc
    # before_script/script bang shell binh thuong (neu khong se bi loi "no command named sh").
    entrypoint: [""]
  before_script:
    - cd "${TF_ROOT}"
    - >
      terraform init
      -backend-config="bucket=${TF_STATE_BUCKET}"
      -backend-config="key=${TF_STATE_KEY}"
      -backend-config="region=${TF_STATE_REGION}"

terraform-plan:
  extends: .terraform-base
  stage: infra
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual

# Chi apply that su khi ban tu bam Run trong GitLab Pipelines - khong bao gio tu dong,
# vi day la thao tac co the tao/xoa tai nguyen that.
terraform-apply:
  extends: .terraform-base
  stage: infra
  needs:
    - terraform-plan
  script:
    - terraform apply tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual

# Doi ngu voi terraform-apply: dung khi muon dep bo toan bo ha tang (vi du xong buoi thuc hanh).
# Luon phai tu bam Run, khong bao gio chay tu dong.
terraform-destroy:
  extends: .terraform-base
  stage: infra
  script:
    - terraform destroy -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      when: manual

build-backend-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" -f backend/Dockerfile backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build-frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# Chay truc tiep tren chinh EC2 (GitLab Runner tu cai, executor shell, tag "aws-ec2").
# Khong SSH tu CI vao server - tranh phai mo port 22 ra Internet cho GitLab shared runner.
deploy-backend:
  stage: deploy
  tags:
    - aws-ec2
  variables:
    BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:latest
  needs:
    - build-backend-image
  script:
    - docker compose --env-file /opt/booking-tour/.env -f deploy/docker-compose.prod.yml pull
    - docker compose --env-file /opt/booking-tour/.env -f deploy/docker-compose.prod.yml up -d --remove-orphans
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# Dung GitLab OIDC de AWS CLI tu doi lay quyen tam thoi qua IAM Role (infra/gitlab-oidc.tf),
# khong luu AWS access key/secret o dau ca. Bien AWS_ROLE_ARN, S3_BUCKET,
# CLOUDFRONT_DISTRIBUTION_ID lay tu output cua "terraform apply", khai bao thu cong 1 lan
# tai GitLab > Settings > CI/CD > Variables.
deploy-frontend:
  stage: deploy
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  needs:
    - build-frontend
  before_script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab_oidc_token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/gitlab_oidc_token
    - export AWS_ROLE_SESSION_NAME="gitlab-ci-${CI_PIPELINE_ID}"
  script:
    - aws s3 sync frontend/dist "s3://${S3_BUCKET}" --delete
    - aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
